<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UroRock — личный штаб</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#19243a;font:16px/1.5 system-ui;min-height:100dvh;display:grid;place-items:center;padding:24px}main{width:min(470px,100%);background:white;border:1px solid #dce4f2;border-radius:28px;padding:38px;box-shadow:0 20px 80px #2948a411}.brand{font-size:13px;font-weight:750;letter-spacing:3px;color:#2948a4}h1{font-size:34px;line-height:1.1;margin:16px 0}p{color:#6f7d96}label{display:block;margin-top:20px;font-weight:600}input{width:100%;margin-top:7px;padding:13px;border:1px solid #cbd7eb;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:650;cursor:pointer;background:#2948a4;color:white}button.secondary{background:#edf2fd;color:#2948a4;margin-top:10px}button:disabled{opacity:.55}#message{font-size:14px;min-height:24px}a{color:#2948a4}</style></head><body><main><div class="brand">UROROCK DASHBOARD</div><h1>Твой рабочий штаб.</h1><p>День, задачи, проекты и маркетинг — в одном месте.</p><p id="session-hint" role="status">Открываем штаб…</p><form id="login" hidden><label>Электронная почта<input id="email" type="email" autocomplete="username" required></label><label>Пароль штаба<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><p>Вход сохранится в этом браузере. При следующем открытии пароль не понадобится.</p><button type="submit">Войти</button><button type="button" class="secondary" id="signup">Первый вход — создать пароль</button><p id="message" role="status"></p></form></main><script>
const form=document.getElementById('login'),message=document.getElementById('message');
async function auth(action){if(!form.reportValidity())return;const buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);message.textContent='Подключаемся…';try{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,email:document.getElementById('email').value,password:document.getElementById('password').value})});const b=await r.json();if(!r.ok)throw Error(b.error);if(b.ok)location.href='/dashboard.html';else message.textContent=b.message;}catch(e){message.textContent=e.message;}finally{buttons.forEach(b=>b.disabled=false);}}
form.addEventListener('submit',e=>{e.preventDefault();auth('login')});document.getElementById('signup').onclick=()=>auth('signup');let restoring=false;
async function restoreSession(){
 if(restoring)return;restoring=true;
 const hint=document.getElementById('session-hint');
 try{const r=await fetch('/api/auth',{cache:'no-store'});
  if(r.ok){location.replace('/dashboard.html');return;}
  if(r.status===401){hint.hidden=true;form.hidden=false;return;}
  if(r.status===403){hint.textContent='У этого аккаунта нет доступа к штабу.';form.hidden=false;return;}
  throw Error('temporary');
 }catch{hint.textContent='Не удалось подключиться. Вход сохранён, повторяем попытку…';setTimeout(restoreSession,10000);}
 finally{restoring=false;}
}
window.addEventListener('online',restoreSession);restoreSession();
</script></body></html>
