<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Данные штаба</title><script src="/session.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#19243a;font:15px/1.45 system-ui;padding:24px}header{display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{margin:12px 0}a{color:#2948a4}select,button,input,textarea{font:inherit;border:1px solid #cbd7eb;border-radius:8px;padding:9px}button{cursor:pointer;background:#2948a4;color:white}select{min-width:200px;background:white}.grid{overflow:auto;max-height:75vh;border:1px solid #dce4f2;border-radius:14px;background:white}table{border-collapse:collapse}td,th{border:1px solid #e6ecf5;padding:6px;min-width:150px}th{position:sticky;top:0;background:#eaf0ff;z-index:1}td:first-child,th:first-child{min-width:60px}td button{white-space:nowrap}textarea{width:230px;min-height:80px;resize:vertical;border-color:transparent}#message{min-height:25px}p{color:#6f7d96}</style></head><body><header><a href="/dashboard.html">← В штаб</a><h1>Данные штаба</h1><select id="table" aria-label="Раздел"></select><button id="add">Добавить строку</button><button id="reload">Обновить</button><button id="export">Скачать копию</button></header><p>Здесь можно менять расписание, события календаря и контент-план. Сохранение — отдельно для каждой строки.</p><p id="message" role="status"></p><div class="grid"><table id="grid"></table></div><script>
let tables={},dirty=false;const pick=document.getElementById('table'),grid=document.getElementById('grid'),msg=document.getElementById('message');
function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}
function render(){dirty=false;grid.replaceChildren();const rows=tables[pick.value]||[],width=Math.max(3,...rows.map(r=>r.length));const head=el('tr');['Строка',...Array.from({length:width},(_,i)=>String.fromCharCode(65+i)),'Действие'].forEach(x=>head.append(el('th',x)));grid.append(head);rows.forEach((row,i)=>{const tr=el('tr');tr.append(el('td',i+1));for(let j=0;j<width;j++){const td=el('td'),input=el('textarea');input.value=String(row[j]??'');input.setAttribute('aria-label',`Строка ${i+1}, столбец ${j+1}`);input.oninput=()=>{dirty=true;};td.append(input);tr.append(td);}const td=el('td'),button=el('button','Сохранить');button.onclick=async()=>{button.disabled=true;try{const values=[...tr.querySelectorAll('textarea')].map(e=>e.value);await shtabCall('saveTableRow',{table:pick.value,row:i+1,values});tables[pick.value][i]=values;dirty=false;msg.textContent='Строка '+(i+1)+' сохранена';}catch(e){msg.textContent=e.message;}finally{button.disabled=false;}};td.append(button);tr.append(td);grid.append(tr);});}
async function load(){try{const name=pick.value;tables=await shtabCall('getTables');pick.replaceChildren();Object.keys(tables).forEach(t=>{const o=el('option',t==='Лист1'?'SMM — контент-план':t);o.value=t;pick.append(o)});if(name)pick.value=name;else pick.value='Календарь';render();msg.textContent='Актуальные данные загружены';}catch(e){msg.textContent=e.message;}}
pick.onchange=render;document.getElementById('reload').onclick=()=>{if(!dirty||confirm('Отменить несохранённые изменения?'))load()};document.getElementById('add').onclick=()=>{if(dirty){msg.textContent='Сначала сохраните изменённую строку';return;}tables[pick.value].push([]);render();grid.lastElementChild.scrollIntoView();};document.getElementById('export').onclick=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tables,null,2)],{type:'application/json'}));a.download='shtab-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});load();
</script></body></html>
